# A Postgres for the live test tier, for anyone without one already.
#
#   docker compose -f docker-compose.test.yml up -d
#   INGEST_TEST_DSN=postgresql://postgres:ingest-local@localhost:55432/ingest_contract \
#     .venv/bin/python -m pytest -m live -q
#
# Not required. The tier reads a DSN out of the environment, so an existing
# server is reached by pointing at it, and it was first run against a
# Homebrew Postgres 16 with no Docker on the machine at all.
#
# Port 55432, not 5432, so this never collides with a Postgres already there.
# The password is in this file on purpose: it is a throwaway server for a test
# suite, and a prompt would stop CI.
#
# Each test creates and drops its own uuid-named schema, so pointing this at a
# shared development server is safe. Nothing is dropped by pattern.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ingest-local
      POSTGRES_DB: ingest_contract
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
