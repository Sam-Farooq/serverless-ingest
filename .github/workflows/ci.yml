name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check src tests

      # Here because the formatter and the code had drifted: five files were
      # wrapped at 88 columns while pyproject sets 100.
      - run: ruff format --check src tests

      # No AWS account, no network, no Docker. moto stubs S3 and SQS, and the
      # Postgres statements run against sqlite through tests/pgshim.py. If any
      # of this ever needs credentials, the job fails rather than skipping.
      - name: pytest
        env:
          AWS_DEFAULT_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
        run: pytest -q --tb=short

  # The ledger against a real Postgres. The job above proves the statements
  # agree with tests/pgshim.py; this one proves pgshim agrees with Postgres,
  # which is the half sqlite cannot do for itself: it has no NUMERIC, no
  # timezone type and no row level locking.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ingest-ci
          POSTGRES_DB: ingest_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      # The tier creates a schema per test and applies sql/001_schema.sql with
      # no translation, so a server that cannot run the real DDL fails here
      # rather than somewhere confusing inside a test.
      - name: the real schema applies
        env:
          PGPASSWORD: ingest-ci
        run: |
          psql -h localhost -U postgres -d ingest_contract -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA ci_ddl_probe' -c 'SET search_path TO ci_ddl_probe' \
            -f sql/001_schema.sql \
            -c "SELECT format_type(atttypid, atttypmod) FROM pg_attribute
                WHERE attrelid = 'ci_ddl_probe.readings'::regclass AND attname = 'value'" \
            -c 'DROP SCHEMA ci_ddl_probe CASCADE'

      - name: the live tier
        env:
          INGEST_TEST_DSN: postgresql://postgres:ingest-ci@localhost:5432/ingest_contract
        run: pytest -m live -q --tb=short -rs

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - run: terraform fmt -check -recursive

      # -backend=false so this needs no state bucket and takes no lock. It
      # does download the provider, which is the only network this job uses.
      - run: terraform init -backend=false -input=false

      - run: terraform validate
