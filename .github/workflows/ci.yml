name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check src tests

      # Here because the formatter and the code had drifted: five files were
      # wrapped at 88 columns while pyproject sets 100.
      - run: ruff format --check src tests

      # No AWS account, no network, no Docker. moto stubs S3 and SQS, and the
      # Postgres statements run against sqlite through tests/pgshim.py. If any
      # of this ever needs credentials, the job fails rather than skipping.
      - name: pytest
        env:
          AWS_DEFAULT_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
        run: pytest -q --tb=short

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - run: terraform fmt -check -recursive

      # -backend=false so this needs no state bucket and takes no lock. It
      # does download the provider, which is the only network this job uses.
      - run: terraform init -backend=false -input=false

      - run: terraform validate
